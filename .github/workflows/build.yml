name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the container, the firmware and the installer packages
        run: node tools/op.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-build
          path: |
            firmware/openpocket.bin
            docs/firmware/*.fwsc
            docs/firmware/manifest.json
            build/SHA256SUMS
      - name: The simulator's engine as WebAssembly (test branch only)
        run: node tools/op.mjs wasm
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-wasm
          path: |
            tools/sim/px_engine.wasm
            tools/sim/px_engine.wasm.sources
      - name: Build the MIDI test channel package (never the installer default)
        run: node tools/op.mjs package-test
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-midi-test
          path: |
            firmware/openpocket-midi-test.bin
            docs/firmware/midi-test/
            build/SHA256SUMS-midi-test
      - name: Host tests
        run: node tools/op.mjs test
